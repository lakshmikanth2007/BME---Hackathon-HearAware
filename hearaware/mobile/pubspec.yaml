name: hearaware
description: "HearAware - See with sound. Hear with light."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  camera: ^0.11.0
  record: ^6.0.0
  permission_handler: ^12.0.0
  flutter_tts: ^4.2.0
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  wakelock_plus: ^1.2.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
